name: Keep Supabase awake

# Supabase free projects are paused after about a week without activity.
# This free job makes one tiny read request twice a week so the project stays active.
# (It only needs the same public URL + anon key that the website already uses.)
on:
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Secrets not set"; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/public_wedding_settings?select=petals_enabled&limit=1")
          echo "HTTP $code"
          [ "$code" = "200" ]
